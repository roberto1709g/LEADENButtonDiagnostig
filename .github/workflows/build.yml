name: APK de diagnóstico del botón LEADEN1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rename translated folders if necessary
        run: |
          if [ -d "aplicación" ]; then mv "aplicación" app; fi
          if [ -f "configuración.gradle" ]; then mv "configuración.gradle" settings.gradle; fi
          if [ -f "propiedades de gradle" ]; then mv "propiedades de gradle" gradle.properties; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LEADEN1-Button-Diagnostic
          path: app/build/outputs/apk/debug/app-debug.apk
